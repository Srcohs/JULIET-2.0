name: Build APK from zip
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          Z=$(ls *.zip | head -1)
          echo "Using zip: $Z"
          mkdir build
          unzip -q "$Z" -d build
          ls build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        working-directory: build
        run: npm install
      - name: Build web files
        working-directory: build
        run: npm run build
      - name: Add Android platform
        working-directory: build
        run: npx cap add android
      - name: Permissions and icons
        working-directory: build
        run: bash scripts/apply-android.sh
      - name: Sync
        working-directory: build
        run: npx cap sync android
      - name: Build debug APK
        shell: bash
        working-directory: build/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log
      - name: Show errors
        if: failure()
        run: |
          echo '### Build error' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -h -E "error:|\.java:|What went wrong|FAILED|Execution failed" build/gradle.log | head -25 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: Juliet-AI-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
