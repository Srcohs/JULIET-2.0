
name: JULIET AI Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: juliet-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JULIET AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      JAVA_VERSION: "17"
      ANDROID_COMPILE_SDK: "34"
      ANDROID_BUILD_TOOLS: "34.0.0"

    steps:
      # 1. Download repository source
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Java JDK 17
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install Android SDK command-line tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Accept SDK licenses and install required Android packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      # 5. Find the Android project root
      - name: Detect project directory
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository files:"
          find . -maxdepth 3 -type f \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
            -o -name 'gradlew' \) \
            -print | sort

          PROJECT_DIR=""

          if [[ -f "settings.gradle.kts" || -f "settings.gradle" ]]; then
            PROJECT_DIR="."
          else
            SETTINGS_FILE="$(find . -maxdepth 5 -type f \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -print -quit)"

            if [[ -n "${SETTINGS_FILE}" ]]; then
              PROJECT_DIR="$(dirname "${SETTINGS_FILE}")"
            fi
          fi

          if [[ -z "${PROJECT_DIR}" ]]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts. Check that the Android project source is committed to GitHub."
            exit 1
          fi

          echo "project_dir=${PROJECT_DIR}" >> "$GITHUB_OUTPUT"
          echo "Detected project directory: ${PROJECT_DIR}"

          if [[ ! -f "${PROJECT_DIR}/app/build.gradle.kts" && \
                ! -f "${PROJECT_DIR}/app/build.gradle" ]]; then
            echo "::error::No app/build.gradle or app/build.gradle.kts found in ${PROJECT_DIR}."
            echo "Check the Android module path in settings.gradle.kts."
            exit 1
          fi

      # 6. Configure Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-cleanup: on-success

      # 7. Check tool versions and project configuration
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          sdkmanager --list_installed

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          echo "Project directory: ${PROJECT_DIR}"
          echo "Project files:"
          ls -la "${PROJECT_DIR}"

          echo "Android application Gradle file:"
          if [[ -f "${PROJECT_DIR}/app/build.gradle.kts" ]]; then
            sed -n '1,220p' "${PROJECT_DIR}/app/build.gradle.kts"
          else
            sed -n '1,220p' "${PROJECT_DIR}/app/build.gradle"
          fi

      # 8. Build debug APK
      - name: Build JULIET debug APK
        id: build_apk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          cd "${PROJECT_DIR}"

          echo "Starting JULIET AI debug build..."

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --build-cache \
            assembleDebug

          echo "Gradle build completed."

      # 9. Verify that the APK exists
      - name: Verify APK output
        id: verify_apk
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          echo "Searching for generated APK files..."

          find "${PROJECT_DIR}" -type f -name '*.apk' -print

          APK_PATH="${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "${APK_PATH}" ]]; then
            APK_PATH="$(find "${PROJECT_DIR}" -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -print -quit)"
          fi

          if [[ -z "${APK_PATH}" || ! -f "${APK_PATH}" ]]; then
            echo "::error::Build completed but no debug APK was found."
            exit 1
          fi

          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cp "${APK_PATH}" "${GITHUB_WORKSPACE}/artifacts/JULIET-AI-debug.apk"

          echo "apk_path=artifacts/JULIET-AI-debug.apk" >> "$GITHUB_OUTPUT"

          echo "APK details:"
          ls -lh "${GITHUB_WORKSPACE}/artifacts/JULIET-AI-debug.apk"
          file "${GITHUB_WORKSPACE}/artifacts/JULIET-AI-debug.apk"

      # 10. Upload APK for download
      - name: Upload JULIET AI APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JULIET-AI-debug-APK
          path: artifacts/JULIET-AI-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 11. Preserve diagnostic logs if the build fails
      - name: Upload Gradle diagnostic files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JULIET-AI-build-diagnostics
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/*.log
          if-no-files-found: ignore
          retention-days: 7

      # 12. Print final result
      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## JULIET AI Android Build"
            echo ""
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Branch/ref: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Java: ${JAVA_VERSION}"
            echo "- Android compile SDK: ${ANDROID_COMPILE_SDK}"
            echo "- Android build tools: ${ANDROID_BUILD_TOOLS}"
            echo "- Build job status: ${{ job.status }}"
            echo ""
            if [[ "${{ job.status }}" == "success" ]]; then
              echo "Debug APK was built and uploaded as the JULIET-AI-debug-APK artifact."
            else
              echo "Build failed. Open the failed step in Actions logs to find the actual error."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          
