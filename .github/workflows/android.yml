name: JULIET AI Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: juliet-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JULIET AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      JAVA_VERSION: "17"
      ANDROID_COMPILE_SDK: "34"
      ANDROID_BUILD_TOOLS: "34.0.0"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Detect Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find . -maxdepth 5 -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -print -quit)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::Android project settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" && \
                ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "::error::Android app Gradle file not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"

      - name: Build JULIET debug APK
        id: build_apk
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Verify and prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          APK_PATH="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [[ -z "$APK_PATH" || ! -f "$APK_PATH" ]]; then
            echo "::error::APK file was not generated."
            exit 1
          fi

          mkdir -p artifacts
          cp "$APK_PATH" artifacts/JULIET-AI-debug.apk

          ls -lh artifacts/JULIET-AI-debug.apk

      - name: Upload JULIET AI APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JULIET-AI-Debug-APK
          path: artifacts/JULIET-AI-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JULIET-AI-Build-Diagnostics
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## JULIET AI Android Build"
            echo ""
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Java: $JAVA_VERSION"
            echo "- Android SDK: $ANDROID_COMPILE_SDK"
            echo "- Build status: $JOB_STATUS"
            echo ""
            if [[ "$JOB_STATUS" == "success" ]]; then
              echo "APK uploaded as JULIET-AI-Debug-APK."
            else
              echo "Build failed. Expand the failed Gradle step to inspect the error."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
